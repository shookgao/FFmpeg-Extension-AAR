name: Build FFmpeg Extension AAR

on:
  workflow_dispatch:
    inputs:
      media3_ref:
        description: 'Media3 仓库分支/标签'
        required: false
        default: '1.11.0-rc01'
        type: string

jobs:
  build-ffmpeg:
    name: Build FFmpeg AAR with legacy video decoders
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MEDIA3_DIR: /tmp/androidx-media
      NDK_VERSION: 29.0.14206865
      DECODERS: >-
        vorbis opus flac alac pcm_mulaw pcm_alaw mp3 amrnb amrwb aac
        ac3 eac3 dca mlp truehd
        mpeg4 msmpeg4v2 msmpeg4 mjpeg mpeg2video mpeg1video h263
        wmv1 wmv2 wmv3 vp6f vp6a rv10 rv20 rv30 rv40

    steps:
      # 1. 检出本仓库
      - uses: actions/checkout@v4

      # 2. Java 17
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3. 安装 Android SDK + NDK
      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          cmdline-tools-version: latest

      # 4. 克隆 Media3 源码
      - name: Clone androidx/media
        run: |
          REF="${{ github.event.inputs.media3_ref || '1.11.0-rc01' }}"
          echo "Media3 ref: ${REF}"
          git clone --depth=1 -b "${REF}" \
            https://github.com/androidx/media.git \
            "${MEDIA3_DIR}"

      # 5. Gradle 缓存
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles(format('{0}/gradle/wrapper/gradle-wrapper.properties', env.MEDIA3_DIR)) }}
          restore-keys: ${{ runner.os }}-gradle-

      # 6. 设置 NDK 环境变量
      - name: Set NDK environment
        run: |
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"

      # 7. 克隆 FFmpeg 源码到 jni 目录
      - name: Clone FFmpeg source
        run: |
          JNI_DIR="${MEDIA3_DIR}/libraries/decoder_ffmpeg/src/main/jni"
          mkdir -p "${JNI_DIR}"
          git clone --depth=1 --branch=release/6.0 \
            git://source.ffmpeg.org/ffmpeg.git \
            "${JNI_DIR}/ffmpeg"
          echo "FFmpeg cloned to: ${JNI_DIR}/ffmpeg"
          ls -la "${JNI_DIR}/"

      # 8. 编译 FFmpeg 原生库（4 种架构）
      - name: Build FFmpeg native libraries
        run: |
          FFMPEG_MODULE_PATH="${MEDIA3_DIR}/libraries/decoder_ffmpeg/src/main"
          NDK_PATH="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          HOST_PLATFORM="linux-x86_64"
          ANDROID_ABI=23

          cd "${FFMPEG_MODULE_PATH}/jni"
          chmod +x build_ffmpeg.sh

          echo "===== 编译 FFmpeg（约 20 分钟）====="
          echo "NDK_PATH=${NDK_PATH}"
          echo "HOST_PLATFORM=${HOST_PLATFORM}"
          echo "ANDROID_ABI=${ANDROID_ABI}"
          echo "DECODERS=${DECODERS}"

          if ./build_ffmpeg.sh \
               "${FFMPEG_MODULE_PATH}" \
               "${NDK_PATH}" \
               "${HOST_PLATFORM}" \
               "${ANDROID_ABI}" \
               ${DECODERS} \
               2>&1 | tee "${MEDIA3_DIR}/ffmpeg_build.log"; then
            echo "✅ FFmpeg 编译成功"
          else
            echo "❌ 编译失败"
            tail -50 "${MEDIA3_DIR}/ffmpeg_build.log"
            exit 1
          fi

      - name: Upload FFmpeg build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-build-log
          path: ${{ env.MEDIA3_DIR }}/ffmpeg_build.log

      # 9. 打包 AAR
      - name: Build AAR
        working-directory: ${{ env.MEDIA3_DIR }}
        run: |
          chmod +x gradlew
          echo "===== 打包 AAR ====="
          if ./gradlew :lib-decoder-ffmpeg:bundleReleaseAar \
               2>&1 | tee "${MEDIA3_DIR}/aar_build.log"; then
            echo "✅ AAR 打包成功"
          else
            echo "❌ 打包失败"
            tail -50 "${MEDIA3_DIR}/aar_build.log"
            exit 1
          fi

      - name: Upload AAR build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aar-build-log
          path: ${{ env.MEDIA3_DIR }}/aar_build.log

      # 10. 验证 AAR
      - name: Verify AAR
        run: |
          AAR="${MEDIA3_DIR}/libraries/decoder_ffmpeg/build/outputs/aar/lib-decoder-ffmpeg-release.aar"
          if [ -f "${AAR}" ]; then
            echo "✅ AAR 文件:"
            ls -lh "${AAR}"
            echo ""
            echo "原生库:"
            unzip -l "${AAR}" | grep '\.so$'
          else
            echo "❌ AAR 不存在"
            ls -la "$(dirname "${AAR}")/" 2>/dev/null || true
            exit 1
          fi

      # 11. 上传 AAR
      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: lib-decoder-ffmpeg-release
          path: ${{ env.MEDIA3_DIR }}/libraries/decoder_ffmpeg/build/outputs/aar/lib-decoder-ffmpeg-release.aar
          if-no-files-found: error
          compression-level: 0

      # 12. 摘要
      - name: Summary
        run: |
          cat <<'EOS'

          ╔══════════════════════════════════════════════════════╗
          ║        FFmpeg AAR 构建完成                          ║
          ╚══════════════════════════════════════════════════════╝

          新增支持的老格式:
            AVI      (.avi)   → mpeg4 / msmpeg4 / mjpeg
            WMV/ASF  (.wmv)   → wmv1 / wmv2 / wmv3
            FLV      (.flv)   → h263 / mpeg4 / vp6
            MPEG-PS  (.mpg)   → mpeg1video / mpeg2video
            RealMedia (.rm)    → rv10 / rv20 / rv30 / rv40

          使用方法:
            1. Artifacts 下载 lib-decoder-ffmpeg-release
            2. 解压得到 .aar，替换 app/libs/ 目录旧文件
            3. 重新编译 APK

          EOS
