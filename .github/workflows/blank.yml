name: Build FFmpeg Extension AAR

on:
  workflow_dispatch:
    inputs:
      media3_ref:
        description: 'Media3 仓库分支/标签（默认 1.11.0-rc01，与项目一致）'
        required: false
        default: '1.11.0-rc01'
        type: string

jobs:
  build-ffmpeg:
    name: Build FFmpeg AAR with legacy video decoders
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MEDIA3_DIR: /tmp/androidx-media
      NDK_VERSION: 29.0.14206865

    steps:
      # 1. 检出本仓库（用于获取 AAR 后上传）
      - uses: actions/checkout@v4

      # 2. Java 17
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3. Android SDK + NDK
      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          cmdline-tools-version: latest

      # 4. 克隆 Media3 源码
      - name: Clone androidx/media
        run: |
          REF="${{ github.event.inputs.media3_ref || '1.11.0-rc01' }}"
          echo "Media3 ref: ${REF}"
          git clone --depth=1 -b "${REF}" \
            https://github.com/androidx/media.git \
            "${MEDIA3_DIR}"
          ls "${MEDIA3_DIR}/"

      # 5. Gradle 缓存
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles(format('{0}/gradle/wrapper/gradle-wrapper.properties', env.MEDIA3_DIR)) }}
          restore-keys: ${{ runner.os }}-gradle-

      # 6. 设置 NDK 环境变量
      - name: Set NDK environment
        run: |
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"

      # 7. 修改解码器列表
      - name: Configure FFmpeg decoders
        run: |
          FFMPEG_DIR="${MEDIA3_DIR}/libraries/decoder_ffmpeg"
          DECODERS="vorbis opus flac alac pcm_mulaw pcm_alaw mp3 amrnb amrwb aac ac3 eac3 dca mlp truehd mpeg4 msmpeg4v2 msmpeg4 mjpeg mpeg2video mpeg1video h263 wmv1 wmv2 wmv3 vp6f vp6a rv10 rv20 rv30 rv40"
          sed -i "s/^ENABLED_DECODERS=(.*)/ENABLED_DECODERS=(${DECODERS})/" "${FFMPEG_DIR}/build_ffmpeg.sh"
          echo "=== ENABLED_DECODERS ==="
          grep "^ENABLED_DECODERS=" "${FFMPEG_DIR}/build_ffmpeg.sh"

      # 8. 编译 FFmpeg 原生库
      - name: Build FFmpeg native libraries
        working-directory: ${{ env.MEDIA3_DIR }}/libraries/decoder_ffmpeg
        run: |
          chmod +x build_ffmpeg.sh
          echo "===== 编译 FFmpeg（约 10-20 分钟）====="
          if ./build_ffmpeg.sh 2>&1 | tee "${MEDIA3_DIR}/ffmpeg_build.log"; then
            echo "✅ FFmpeg 编译成功"
          else
            tail -50 "${MEDIA3_DIR}/ffmpeg_build.log"
            exit 1
          fi

      - name: Upload FFmpeg build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-build-log
          path: ${{ env.MEDIA3_DIR }}/ffmpeg_build.log

      # 9. 打包 AAR
      - name: Build AAR
        working-directory: ${{ env.MEDIA3_DIR }}
        run: |
          chmod +x gradlew
          echo "===== 打包 AAR (:lib-decoder-ffmpeg:bundleReleaseAar) ====="
          if ./gradlew :lib-decoder-ffmpeg:bundleReleaseAar \
               2>&1 | tee "${MEDIA3_DIR}/aar_build.log"; then
            echo "✅ AAR 打包成功"
          else
            tail -50 "${MEDIA3_DIR}/aar_build.log"
            exit 1
          fi

      - name: Upload AAR build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aar-build-log
          path: ${{ env.MEDIA3_DIR }}/aar_build.log

      # 10. 验证 AAR
      - name: Verify AAR
        run: |
          AAR="${MEDIA3_DIR}/libraries/decoder_ffmpeg/build/outputs/aar/lib-decoder-ffmpeg-release.aar"
          if [ -f "${AAR}" ]; then
            echo "✅ AAR 文件信息:"
            ls -lh "${AAR}"
            echo ""
            echo "原生库列表:"
            unzip -l "${AAR}" | grep '\.so$'
          else
            echo "❌ AAR 未找到"
            ls -la "$(dirname "${AAR}")/" 2>/dev/null || echo "输出目录也不存在"
            exit 1
          fi

      # 11. 上传 AAR
      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: lib-decoder-ffmpeg-release
          path: ${{ env.MEDIA3_DIR }}/libraries/decoder_ffmpeg/build/outputs/aar/lib-decoder-ffmpeg-release.aar
          if-no-files-found: error
          compression-level: 0

      # 12. 摘要
      - name: Summary
        run: |
          cat <<'EOS'

          ╔══════════════════════════════════════════════════════╗
          ║        FFmpeg AAR 构建完成                          ║
          ╚══════════════════════════════════════════════════════╝

          新增支持的老格式:
            AVI      (.avi)   → mpeg4 / msmpeg4 / mjpeg
            WMV/ASF  (.wmv)   → wmv1 / wmv2 / wmv3
            FLV      (.flv)   → h263 / mpeg4 / vp6
            MPEG-PS  (.mpg)   → mpeg1video / mpeg2video
            RealMedia (.rm)    → rv10 / rv20 / rv30 / rv40

          使用方法:
            1. 下载 Artifact: lib-decoder-ffmpeg-release
            2. 解压得到 lib-decoder-ffmpeg-release.aar
            3. 放入 app/libs/ 目录替换旧文件
            4. 重新编译 APK

          EOS
