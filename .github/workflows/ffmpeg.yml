name: Build FFmpeg Extension AAR

on:
  workflow_dispatch:
    inputs:
      media3_ref:
        description: 'Media3 仓库分支/标签'
        required: false
        default: '1.11.0-rc01'
        type: string

jobs:
  build-ffmpeg:
    name: Build FFmpeg AAR with legacy video decoders
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MEDIA3_DIR: /tmp/androidx-media
      NDK_VERSION: 29.0.14206865
      DECODERS: >-
        vorbis opus flac alac pcm_mulaw pcm_alaw mp3 amrnb amrwb aac
        ac3 eac3 dca mlp truehd
        mpeg4 msmpeg4v2 msmpeg4 mjpeg mpeg2video mpeg1video h263
        wmv1 wmv2 wmv3 vp6f vp6a rv10 rv20 rv30 rv40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          cmdline-tools-version: latest

      - name: Clone androidx/media
        run: |
          REF="${{ github.event.inputs.media3_ref || '1.11.0-rc01' }}"
          git clone --depth=1 -b "${REF}" \
            https://github.com/androidx/media.git "${MEDIA3_DIR}"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles(format('{0}/gradle/wrapper/gradle-wrapper.properties', env.MEDIA3_DIR)) }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Set NDK environment
        run: |
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"

      - name: Clone FFmpeg source
        run: |
          JNI_DIR="${MEDIA3_DIR}/libraries/decoder_ffmpeg/src/main/jni"
          mkdir -p "${JNI_DIR}"
          git clone --depth=1 --branch=release/6.0 \
            https://github.com/FFmpeg/FFmpeg.git "${JNI_DIR}/ffmpeg"

      - name: Build FFmpeg native libraries
        shell: bash
        run: |
          set -e
          FFMPEG_MODULE_PATH="${MEDIA3_DIR}/libraries/decoder_ffmpeg/src/main"
          NDK_PATH="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          HOST_PLATFORM="linux-x86_64"
          ANDROID_ABI=23

          cd "${FFMPEG_MODULE_PATH}/jni"
          chmod +x build_ffmpeg.sh

          echo "===== 开始编译 FFmpeg ====="
          LOG="${MEDIA3_DIR}/ffmpeg_build.log"
          ./build_ffmpeg.sh \
            "${FFMPEG_MODULE_PATH}" "${NDK_PATH}" \
            "${HOST_PLATFORM}" "${ANDROID_ABI}" \
            ${DECODERS} > "${LOG}" 2>&1
          EC=$?

          echo "=== 日志末尾 30 行 ==="
          tail -30 "${LOG}"
          echo "=== 退出码: $EC ==="

          if [ $EC -ne 0 ]; then
            echo "❌ FFmpeg 编译失败"
            exit 1
          fi
          echo "✅ FFmpeg 编译成功"
          find "${FFMPEG_MODULE_PATH}/jni/ffmpeg/android-libs" -name "*.a" 2>/dev/null | sort

      - name: Upload FFmpeg build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-build-log
          path: ${{ env.MEDIA3_DIR }}/ffmpeg_build.log

      - name: Build AAR
        shell: bash
        run: |
          set -e
          cd "${MEDIA3_DIR}"
          chmod +x gradlew

          echo "===== 打包 AAR ====="
          echo "  TASK: :lib-decoder-ffmpeg:bundleReleaseAar"
          echo "  PWD: $(pwd)"

          export ANDROID_HOME="${ANDROID_SDK_ROOT}"

          LOG="${MEDIA3_DIR}/aar_build.log"
          ./gradlew :lib-decoder-ffmpeg:bundleReleaseAar > "${LOG}" 2>&1
          EC=$?

          echo "=== 日志末尾 30 行 ==="
          tail -30 "${LOG}"
          echo "=== 退出码: $EC ==="

          if [ $EC -ne 0 ]; then
            echo "❌ AAR 打包失败"
            exit 1
          fi
          echo "✅ AAR 打包成功"

          # 记录 AAR 路径到文件，供后续步骤使用
          find "${MEDIA3_DIR}" -name "*.aar" -path "*/decoder_ffmpeg/*" > "${MEDIA3_DIR}/aar_path.txt"
          echo "=== 找到的 AAR 文件 ==="
          cat "${MEDIA3_DIR}/aar_path.txt" || echo "无"

      - name: Upload AAR build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aar-build-log
          path: ${{ env.MEDIA3_DIR }}/aar_build.log

      - name: Extract and verify AAR
        shell: bash
        run: |
          set -e
          echo "=== 搜索 AAR ==="
          find "${MEDIA3_DIR}" -name "*.aar" -path "*/decoder_ffmpeg/*" 2>/dev/null | sort

          AAR_PATH=$(find "${MEDIA3_DIR}" -name "lib-decoder-ffmpeg-release.aar" 2>/dev/null | head -1)
          if [ -z "${AAR_PATH}" ]; then
            echo "❌ 找不到 AAR"
            echo "=== 尝试全盘搜索 ==="
            find /tmp -name "*.aar" -maxdepth 6 2>/dev/null || true
            echo "=== decoder_ffmpeg 目录 ==="
            find "${MEDIA3_DIR}/libraries/decoder_ffmpeg" -maxdepth 4 -type d 2>/dev/null | head -20 || true
            exit 1
          fi

          echo "✅ 找到 AAR: ${AAR_PATH}"
          echo "=== 文件信息 ==="
          ls -lh "${AAR_PATH}"
          echo "=== 原生库列表 ==="
          unzip -l "${AAR_PATH}" | grep '\.so$'

          # 保存路径供后续步骤使用
          echo "${AAR_PATH}" > /tmp/aar_path.txt

      - name: Upload AAR artifact
        shell: bash
        run: |
          AAR_PATH=$(cat /tmp/aar_path.txt)
          echo "上传: ${AAR_PATH}"
          # actions/upload-artifact 不直接支持变量 path
          cp "${AAR_PATH}" "${MEDIA3_DIR}/lib-decoder-ffmpeg-release.aar"

      - uses: actions/upload-artifact@v4
        with:
          name: lib-decoder-ffmpeg-release
          path: ${{ env.MEDIA3_DIR }}/lib-decoder-ffmpeg-release.aar
          if-no-files-found: error
          compression-level: 0

      - name: Summary
        run: |
          cat <<'EOS'

          ╔══════════════════════════════════════════════════════╗
          ║        FFmpeg AAR 构建完成                          ║
          ╚══════════════════════════════════════════════════════╝

          新增解码器:
            AVI      (.avi)   → mpeg4 / msmpeg4 / mjpeg
            WMV/ASF  (.wmv)   → wmv1 / wmv2 / wmv3
            FLV      (.flv)   → h263 / mpeg4 / vp6
            MPEG-PS  (.mpg)   → mpeg1video / mpeg2video
            RealMedia (.rm)   → rv10 / rv20 / rv30 / rv40

          使用: Artifacts → lib-decoder-ffmpeg-release → 解压 → 替换 app/libs/
          EOS
